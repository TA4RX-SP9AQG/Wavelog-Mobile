name: wavelog_mobile
description: Wavelog Amateur Radio Logging Mobile App
publish_to: 'none'
version: 3.2.7+96

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP
  dio: ^5.4.3+1

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^14.2.0

  # File handling
  file_picker: ^8.0.7
  path_provider: ^2.1.3
  share_plus: ^9.0.0

  # UI
  cached_network_image: ^3.3.1
  intl: ^0.20.2
  url_launcher: ^6.2.6

  # Connectivity
  connectivity_plus: ^6.0.3

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Location
  geolocator: ^12.0.0

  # Compass
  flutter_compass: ^0.8.0

  # Animations
  lottie: ^3.1.2
  image: ^4.2.0

  # Utilities
  package_info_plus: ^8.0.0
  uuid: ^4.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0
  xml: ^6.5.0
  home_widget: ^0.7.0
  firebase_core: ^3.4.0
  cloud_firestore: ^5.4.0
  firebase_messaging: ^15.1.0
  firebase_auth: ^5.2.0
  google_sign_in: ^6.2.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/animations/achievements/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
