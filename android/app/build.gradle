import com.android.build.gradle.internal.api.ApkVariantOutputImpl

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.wavelog_mobile"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    // AGP embeds a "Dependency metadata" block in the APK Signing Block by
    // default (Play Console dependency transparency). F-Droid's scanner
    // rejects any extra signing block, so it must be disabled here.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId "com.wavelog_mobile"
        minSdkVersion flutter.minSdkVersion
        // 36, not 37: F-Droid's buildserver installs API 37 under a
        // differently-named SDK directory (android-37.0 instead of
        // android-37), which breaks several Gradle tasks there. 36 is
        // only a soft warning from permission_handler_android, not a
        // compile error — see android { compileSdk } below.
        targetSdk 36
        versionCode flutter.versionCode
        // pubspec.yaml'daki sürümü kullan — sabit değer pubspec'i eziyordu
        versionName flutter.versionName
        // Flutter'ın eklentisi ndk.abiFilters'ı otomatik dolduruyor, bu da
        // splits.abi ile çakışıyor — abi seçimini splits'e bırak.
        ndk {
            abiFilters.clear()
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk false
        }
    }
}

// F-Droid requires a distinct versionCode per ABI split (see
// https://f-droid.org/en/docs/Submitting_to_F-Droid_Quick_Start_Guide/#setup-abi-split).
def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = abiCodes[output.filters.find { it.filterType == "ABI" }?.identifier]
        if (abiVersionCode != null) {
            ((ApkVariantOutputImpl) output).versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }

    // The NDK linker embeds a .note.gnu.build-id in every compiled native
    // library that is not derived solely from the input content, so two
    // separate builds of the exact same source (e.g. the `jni` package's
    // libdartjni.so) produce byte-different output purely from this note -
    // confirmed by diffing F-Droid's from-source rebuild against our own:
    // every other byte matched. Strip it post-build so both sides land on
    // an identical (build-id-less) file.
    def variantName = variant.name.capitalize()
    tasks.matching { it.name == "strip${variantName}DebugSymbols" }.configureEach { stripTask ->
        stripTask.doLast {
            def objcopy = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy")
            if (!objcopy.exists()) {
                objcopy = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-objcopy.exe")
            }
            stripTask.outputs.files.each { dir ->
                if (dir.isDirectory()) {
                    fileTree(dir: dir, include: "**/*.so").each { so ->
                        exec {
                            commandLine objcopy.path, "--remove-section=.note.gnu.build-id", so.path
                            ignoreExitValue true
                        }
                    }
                }
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // WindowCompat.setDecorFitsSystemWindows (Android 15 / SDK 35
    // edge-to-edge requirement) — explicit rather than relying on
    // whatever version Flutter's own embedding happens to pull in
    // transitively.
    implementation 'androidx.core:core-ktx:1.13.1'
}
